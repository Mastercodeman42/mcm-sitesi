<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC.K Konseyi Başvuru Yeri</title>
<style>
body {
  margin: 0;
  font-family: 'Trebuchet MS', sans-serif;
  background: radial-gradient(circle at center, #0b0b0b 0%, #050505 100%);
  color: #dcdcdc;
  background-image: url('https://i.ibb.co/6sx4dH2/minecraft-dungeons-bg.jpg');
  background-size: cover;
  background-attachment: fixed;
}

header {
  background: rgba(0,0,0,0.8);
  text-align: center;
  padding: 20px;
  color: #84ff68;
  font-size: 28px;
  font-weight: bold;
  text-shadow: 0 0 10px #4cff00;
}

nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 10px;
}

nav a {
  text-decoration: none;
  color: white;
  background: linear-gradient(90deg, #8a2be2, #4b0082);
  padding: 10px 15px;
  border-radius: 10px;
  transition: 0.3s;
}

nav a:hover {
  transform: scale(1.1);
  box-shadow: 0 0 10px #8a2be2;
}

.container {
  max-width: 600px;
  margin: 30px auto;
  background: rgba(0,0,0,0.8);
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 20px #4b0082;
}

input, textarea, button, select {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 16px;
}

button {
  background: linear-gradient(90deg, #4b0082, #8a2be2);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: linear-gradient(90deg, #8a2be2, #4b0082);
  transform: scale(1.05);
}

.admin-panel {
  display: none;
}

.list {
  margin-top: 15px;
}

.approved { color: #00ff80; }
.rejected { color: #ff5050; }

h2 {
  text-align: center;
  color: #84ff68;
  text-shadow: 0 0 10px #4cff00;
}
</style>
</head>
<body>

<header>
  MC.K Konseyi Başvuru Yeri
  <nav>
    <a href="https://youtube.com/@mastercodeman-p9m?si=pL7t3Q4D2YuEQF9I" target="_blank">📺 YouTube</a>
    <a href="https://discord.gg/Dra2SUmJJQ" target="_blank">💬 Discord</a>
  </nav>
</header>

<div class="container" id="formContainer">
  <h2>Başvuru Formu</h2>
  <input type="text" id="isim" placeholder="Ad Soyad" required>
  <input type="text" id="nick" placeholder="Minecraft Nickin" required>
  <input type="number" id="yas" placeholder="Yaş (10-16)" min="10" max="16" required>
  <textarea id="neden" placeholder="Neden katılmak istiyorsun?" rows="4"></textarea>
  <button onclick="basvuruGonder()">Başvuruyu Gönder</button>
</div>

<div class="container" id="adminLogin">
  <h2>Admin / Kurucu Girişi</h2>
  <input type="password" id="adminSifre" placeholder="Şifreyi Gir">
  <button onclick="girisYap()">Giriş Yap</button>
</div>

<div class="container admin-panel" id="adminPanel">
  <h2>Başvurular</h2>
  <div id="basvuruListesi"></div>
  <h2>Onaylananlar</h2>
  <div id="onaylananlar" class="list approved"></div>
  <h2>Reddedilenler</h2>
  <div id="reddedilenler" class="list rejected"></div>
</div>
