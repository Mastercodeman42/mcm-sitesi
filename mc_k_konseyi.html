<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC.K Konseyi Başvuru Yeri</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<style>
body {
  margin: 0;
  font-family: 'Trebuchet MS', sans-serif;
  background: radial-gradient(circle at center, #0b0b0b 0%, #050505 100%);
  color: #dcdcdc;
  background-image: url('https://i.ibb.co/6sx4dH2/minecraft-dungeons-bg.jpg');
  background-size: cover;
  background-attachment: fixed;
}

header {
  background: rgba(0,0,0,0.8);
  text-align: center;
  padding: 20px;
  color: #84ff68;
  font-size: 28px;
  font-weight: bold;
  text-shadow: 0 0 10px #4cff00;
}

nav {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 10px;
}

nav a {
  text-decoration: none;
  color: white;
  background: linear-gradient(90deg, #8a2be2, #4b0082);
  padding: 10px 15px;
  border-radius: 10px;
  transition: 0.3s;
}

nav a:hover {
  transform: scale(1.1);
  box-shadow: 0 0 10px #8a2be2;
}

.container {
  max-width: 600px;
  margin: 30px auto;
  background: rgba(0,0,0,0.8);
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 20px #4b0082;
}

input, textarea, button, select {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
  border: none;
  outline: none;
  font-size: 16px;
}

button {
  background: linear-gradient(90deg, #4b0082, #8a2be2);
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: linear-gradient(90deg, #8a2be2, #4b0082);
  transform: scale(1.05);
}

.admin-panel {
  display: none;
}

.list {
  margin-top: 15px;
}

.approved { color: #00ff80; }
.rejected { color: #ff5050; }

h2 {
  text-align: center;
  color: #84ff68;
  text-shadow: 0 0 10px #4cff00;
}
</style>
</head>
<body>

<header>
  MC.K Konseyi Başvuru Yeri
  <nav>
    <a href="https://youtube.com/@mastercodeman-p9m?si=pL7t3Q4D2YuEQF9I" target="_blank">📺 YouTube</a>
    <a href="https://discord.gg/Dra2SUmJJQ" target="_blank">💬 Discord</a>
  </nav>
</header>

<div class="container" id="formContainer">
  <h2>Başvuru Formu</h2>
  <input type="text" id="isim" placeholder="Ad Soyad" required>
  <input type="text" id="nick" placeholder="Minecraft Nickin" required>
  <input type="number" id="yas" placeholder="Yaş (10-16)" min="10" max="16" required>
  <textarea id="neden" placeholder="Neden katılmak istiyorsun?" rows="4"></textarea>
  <button id="gonderBtn" type="button" onclick="basvuruGonder()">Başvuruyu Gönder</button>
</div>

<div class="container" id="adminLogin">
  <h2>Admin / Kurucu Girişi</h2>
  <input type="password" id="adminSifre" placeholder="Şifreyi Gir">
  <button id="girisBtn" type="button" onclick="girisYap()">Giriş Yap</button>
</div>

<div class="container admin-panel" id="adminPanel">
  <h2>Başvurular</h2>
  <div id="basvuruListesi"></div>
  <h2>Onaylananlar</h2>
  <div id="onaylananlar" class="list approved"></div>
  <h2>Reddedilenler</h2>
  <div id="reddedilenler" class="list rejected"></div>
</div>

<script>
/* --- DİKKAT: EmailJS bilgilerini kendi hesabından alıp aşağıya koy. --- */
emailjs.init("9IrNTaWWfJqPCxE1Qazm0"); // EmailJS Public Key (ör: user_xxx...)
const EMAILJS_SERVICE_ID = "service_e6u4yl9"; // provided by you // (ör: service_xxx...)
const EMAILJS_TEMPLATE_ID = "template_lf11yoh"; // provided by you // (ör: template_xxx...)
const MAIL_TO = "angerlord1545@gmail.com"; // E-posta alıcısı (senin Gmail)

// İstenen şifreler
const KURUCU_SIFRE = "Konya15454545";
const ADMIN_SIFRE = "konsey14531";

// LocalStorage verileri
let basvurular = JSON.parse(localStorage.getItem('basvurular') || '[]');
let onaylananlar = JSON.parse(localStorage.getItem('onaylananlar') || '[]');
let reddedilenler = JSON.parse(localStorage.getItem('reddedilenler') || '[]');

function basvuruGonder() {
  const isim = document.getElementById('isim').value.trim();
  const nick = document.getElementById('nick').value.trim();
  const yas = parseInt(document.getElementById('yas').value);
  const neden = document.getElementById('neden').value.trim();

  if (!isim || !nick || !yas || !neden) {
    alert("Lütfen tüm alanları doldurun.");
    return;
  }
  if (isNaN(yas) || yas < 10 || yas > 16) {
    alert("Yaş 10 ile 16 arasında olmalıdır.");
    return;
  }

  const basvuru = { isim, nick, yas, neden, tarih: new Date().toISOString() };
  basvurular.push(basvuru);
  localStorage.setItem('basvurular', JSON.stringify(basvurular));

  // Email gönderimi (EmailJS kullanılarak)
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
    isim: isim,
    nick: nick,
    yas: yas,
    neden: neden,
    tarih: basvuru.tarih,
    to_email: MAIL_TO
  }).then(function(response) {
      alert("Başvurunuz gönderildi! E-posta ile de bildirilecektir.");
  }, function(error) {
      alert("Başvurunuz kaydedildi ancak e-posta gönderilemedi. EmailJS bilgilerini kontrol et.");
  });

  // Formu temizle
  document.getElementById('isim').value = '';
  document.getElementById('nick').value = '';
  document.getElementById('yas').value = '';
  document.getElementById('neden').value = '';

  // Eğer admin panel açıksa listeyi güncelle
  listeleBasvurular();
}

function girisYap() {
  const sifre = document.getElementById('adminSifre').value;
  if (sifre === KURUCU_SIFRE) {
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('adminLogin').style.display = 'none';
    listeleBasvurular();
    alert('Kurucu olarak giriş yapıldı.');
  } else if (sifre === ADMIN_SIFRE) {
    document.getElementById('adminPanel').style.display = 'block';
    document.getElementById('adminLogin').style.display = 'none';
    listeleBasvurular();
    alert('Admin olarak giriş yapıldı.');
  } else {
    alert('Şifre yanlış!');
  }
}

function listeleBasvurular() {
  const liste = document.getElementById('basvuruListesi');
  liste.innerHTML = '';
  basvurular.forEach((b, index) => {
    const div = document.createElement('div');
    div.style.padding = '10px';
    div.style.borderBottom = '1px solid rgba(255,255,255,0.05)';
    div.innerHTML = `
      <strong>${b.isim}</strong> (${b.nick}, ${b.yas}) - <em>${new Date(b.tarih).toLocaleString()}</em>
      <p style="margin:8px 0;">${b.neden}</p>
      <button onclick="onayla(${index})">Onayla</button>
      <button onclick="reddet(${index})">Reddet</button>
    `;
    liste.appendChild(div);
  });

  document.getElementById('onaylananlar').innerHTML = onaylananlar.map(b => `${b.isim} (${b.nick})`).join('<br>');
  document.getElementById('reddedilenler').innerHTML = reddedilenler.map(b => `${b.isim} (${b.nick})`).join('<br>');
}

function onayla(index) {
  onaylananlar.push(basvurular[index]);
  basvurular.splice(index, 1);
  localStorage.setItem('basvurular', JSON.stringify(basvurular));
  localStorage.setItem('onaylananlar', JSON.stringify(onaylananlar));
  listeleBasvurular();
}

function reddet(index) {
  reddedilenler.push(basvurular[index]);
  basvurular.splice(index, 1);
  localStorage.setItem('basvurular', JSON.stringify(basvurular));
  localStorage.setItem('reddedilenler', JSON.stringify(reddedilenler));
  listeleBasvurular();
}

window.onload = function() {
  listeleBasvurular();
  // ekstra güvenlik: butonlara event listener ekle (onclick ile birlikte çalışır)
  const gonder = document.getElementById('gonderBtn');
  const giris = document.getElementById('girisBtn');
  if (gonder) gonder.addEventListener('click', basvuruGonder);
  if (giris) giris.addEventListener('click', girisYap);
};
</script>

</body>
</html>
